spring.application.name=post-scheduler
server.port=8080

# H2 in-memory database (default). Use the "mysql" profile for MySQL.
spring.datasource.url=jdbc:h2:mem:postdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Experiment 4: count SQL statements per request (used by the performance endpoints)
spring.jpa.properties.hibernate.generate_statistics=true
# Change to DEBUG to print every SQL statement (use it for the N+1 screenshot)
logging.level.org.hibernate.SQL=INFO

# JSON dates as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS: allowed frontend origins (comma separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Pagination defaults (Experiment 3)
app.pagination.default-page-size=10
app.pagination.max-page-size=50
app.pagination.default-sort-by=createdAt
app.pagination.default-direction=desc

# Caching (Experiment 4). Set spring.cache.type=none to switch caching OFF for benchmarking.
spring.cache.type=jcache
app.cache.ttl-minutes=10
app.cache.max-entries=500

# Insert sample data on startup (set to false to disable)
app.seed.enabled=true

# Security / JWT (Experiment 5)
# In production, supply the secret through the JWT_SECRET environment variable (min. 32 characters).
app.jwt.secret=${JWT_SECRET:post-scheduler-dev-secret-key-please-change-in-production-0123456789}
# Access token: short-lived (Experiment 6). Refresh token: long-lived, rotated on every use.
app.jwt.expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.security.admin-username=admin
app.security.admin-password=${ADMIN_PASSWORD:Admin@123}

# Encryption (Experiment 6): AES-256 key, Base64 encoded, must decode to exactly 32 bytes.
# This default is for DEVELOPMENT ONLY. In real use set the ENCRYPTION_KEY environment variable
# (generate one with:  openssl rand -base64 32). If the key is lost, encrypted data cannot be recovered.
app.crypto.secret-key=${ENCRYPTION_KEY:ZbU9SO1VdBxdEbLUdQrUREkQJcRkzbGnCOybXz0gHzo=}
