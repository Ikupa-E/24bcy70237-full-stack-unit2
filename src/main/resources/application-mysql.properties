# Activate with: mvn spring-boot:run "-Dspring-boot.run.profiles=mysql"
# Requires a running MySQL server. The database is created automatically if the user is allowed to.
spring.datasource.url=jdbc:mysql://localhost:3306/postscheduler?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
